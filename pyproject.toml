[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontiergrid-observant"
version = "0.1.0"
description = "Unclassified Phase I feasibility testbed for DON Observant-AI multi-agent contextual fusion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Techman Studios" }]
keywords = [
  "agentic-ai",
  "risk-aware-ai",
  "multimodal-fusion",
  "human-ai-teaming",
  "synthetic-data",
  "sbir",
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pydantic>=2.7,<3",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
eval = [
  "pandas>=2.2",
]
demo = [
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
frontiergrid-observant = "frontiergrid_observant.demo.run_demo:main"

[tool.setuptools.packages.find]
include = ["frontiergrid_observant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
